name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 + luacheck
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1 luarocks && sudo luarocks install luacheck
      - name: luacheck
        run: luacheck .
      - name: Mock-API tests
        run: lua5.1 tests/run_tests.lua .
